[KoMPoSTInputs]
tIn=0.01;
tOut = 1.2;

InputFile=examples/mcdipper/event_0.dat
# HDF5 input currently supports McDipper Event_*.h5 files only.
InputFormat=auto
McDipperKFactor=1.0
OutputFileTag=tau0_0.001_tau_1.0/Tmunu
OutputFormat=dat

[KoMPoSTParameters]
NuEff = 40.0
EtaOverS = 0.16
EtaOverSTemperatureScale = 0.1
# Gaussian response regulator width in fm
Sigma_Res_Reg = 0.1

# 0 legacy FS, 1 EKT, 2 low-k (unsupported in 3D), 3 ExactFS
EVOLUTION_MODE=3

# ExactFS parameters
V_FS=0.6
NPHI=128
# ExactFS only: evolve tau*n_u, tau*n_d and tau*n_s together; initial J^x, J^y and J^eta are zero.
EVOLVE_CHARGES=1

# 0 or 1
ENERGY_PERTURBATIONS=0
MOMENTUM_PERTURBATIONS=0

Regulator=TwoPass

[EventInput]
# lattice spacing in fm
afm = 0.12
deta = 0.2
# number of grid points on a square lattice
Ns=251;
Neta=121;

# The first grid point to include in the x direction
xSTART=0;
# The last grid point to include in the x direction
xEND=250;

#The first grid point to include in the y direction
ySTART=0;
#The last grid point to include in the y direction
yEND=250;

#The first grid point to include in the eta direction
etaSTART=0;
#The last  grid point to include in the eta direction
etaEND=120;
